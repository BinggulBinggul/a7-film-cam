name: Build Sony A7 Film APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Android SDK manually
        run: |
          # 안드로이드 SDK 명령줄 도구 자동 다운로드 및 설치
          mkdir -p $HOME/cmdline-tools
          curl -o $HOME/cmdline-tools/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q $HOME/cmdline-tools/tools.zip -d $HOME/cmdline-tools
          mkdir -p $HOME/cmdline-tools/latest
          mv $HOME/cmdline-tools/cmdline-tools/* $HOME/cmdline-tools/latest/
          
          # 환경변수 설정
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install SDK Platforms and Accept Licenses
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          yes | $HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          $HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-16" "build-tools;30.0.3"

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A7FilmCam-APK
          path: app/build/outputs/apk/debug/app-debug.apk
