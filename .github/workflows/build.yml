name: Build Sony A7 Film APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a43b68077bc123d9859318ef1f926701b" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license

      - name: Install Android SDK Platform 16 & Build Tools
        run: |
          sdkmanager --install "platforms;android-16" "build-tools;30.0.3"

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A7FilmCam-APK
          path: app/build/outputs/apk/debug/app-debug.apk
